<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quietly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div>
          <p class="eyebrow">Quietly</p>
          <h1>Референсы</h1>
        </div>
        <span id="siteBadge" class="badge">Проверяю</span>
      </header>

      <section id="authBox" class="panel">
        <p id="authState" class="muted">Проверяю вход...</p>
        <div class="row">
          <button id="signInButton" class="ghost" type="button">Войти</button>
          <button id="refreshAuthButton" class="ghost" type="button">Обновить</button>
        </div>
      </section>

      <section id="controls" class="panel">
        <label class="field">
          <span>Коллекция для сохранения</span>
          <select id="collectionSelect">
            <option value="">Без коллекции</option>
          </select>
        </label>
        <p class="muted">
          На поддерживаемых сайтах кнопка Quietly появляется прямо внизу страницы.
        </p>
      </section>

      <section id="unsupportedBox" class="panel hidden">
        <p class="muted">Этот сайт пока не поддерживается</p>
        <button id="savePageButton" class="ghost" type="button">Сохранить страницу</button>
      </section>

      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="shared/config.js"></script>
    <script src="shared/api-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
